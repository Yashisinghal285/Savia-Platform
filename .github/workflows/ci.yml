name: Savia CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: savia-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./savia-frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: ./savia-frontend
        run: npm run build

  backend-build:
    name: Backend Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend with Maven
        working-directory: ./savia-backend
        run: ./mvnw clean compile -DskipTests
